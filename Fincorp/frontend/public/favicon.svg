<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Shield Metallic Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" ry="128" fill="url(#bgGradient)" filter="url(#shadow)" />
  
  <!-- Outer Glow Border -->
  <rect x="20" y="20" width="472" height="472" rx="124" ry="124" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

  <!-- Central Shield Design -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Shield Outer Outline -->
    <path d="M 0 -115 C 65 -115 105 -95 105 -35 C 105 45 45 100 0 125 C -45 100 -105 45 -105 -35 C -105 -95 -65 -115 0 -115 Z" 
          fill="url(#shieldGradient)" filter="url(#glow)" />
    
    <!-- Inner Shield Inset -->
    <path d="M 0 -98 C 52 -98 86 -82 86 -30 C 86 36 36 82 0 104 C -36 82 -86 36 -86 -30 C -86 -82 -52 -98 0 -98 Z" 
          fill="#1e293b" opacity="0.12" />

    <!-- Sharp Checkmark inside Shield -->
    <path d="M -36 -5 L -10 22 L 42 -30" 
          fill="none" stroke="url(#goldGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Sparkle Gold Star Accent top right -->
    <path d="M 52 -75 L 56 -62 L 69 -58 L 56 -54 L 52 -41 L 48 -54 L 35 -58 L 48 -62 Z" fill="url(#goldGradient)" />
  </g>
</svg>
